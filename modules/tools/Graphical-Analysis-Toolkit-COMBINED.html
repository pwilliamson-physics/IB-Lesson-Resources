    datasets[activeDataset].visible = !datasets[activeDataset].visible;
    renderDatasetChips(); updateDatasetButtons();
    drawCurvePlot(); updateCurveReadout();
  });
  $('ugt-ds-color').addEventListener('click', function(){
    if(datasets.length < 2) return;
    togglePalettePicker();
  });
  document.addEventListener('click', function(ev){
    var pal = $('ugt-ds-palette');
    if(!pal || pal.hidden) return;
    if(ev.target===$('ugt-ds-color') || pal.contains(ev.target)) return;
    pal.hidden = true;
  });

  // manual axis range: give the highest x and y value you expect (the axes always start at 0,0)
  // and click "Set range" to pin the axes there — useful before you have any data plotted yet,
  // when the graph would otherwise default to a scale left over from the last curve shape.
  $('ugt-cv-range-set').addEventListener('click', function(){
    var xmaxRaw=$('ugt-cv-xmax').value, ymaxRaw=$('ugt-cv-ymax').value;
    if(xmaxRaw===''||ymaxRaw===''){
      flashStatus($('ugt-cv-d-status'), 'Give the highest x value and the highest y value to set a range.');
      return;
    }
    var xhi=num(xmaxRaw), yhi=num(ymaxRaw);
    if(!(xhi>0) || !(yhi>0)){
      flashStatus($('ugt-cv-d-status'), 'The highest x and y values must be greater than 0.');
      return;
    }
    manualRange = {xlo:0, xhi:xhi, ylo:0, yhi:yhi};
    drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Axis range set from (0, 0).');
  });
  // "Autoscale" zooms tight to the data actually on the graph right now — it can crop out (0,0)
  // if none of your data is near the origin. "Autoscale (0,0 origin)" does the same fit but always
  // keeps the origin in view, extending the axis down to 0 rather than cropping to it.
  $('ugt-cv-range-auto').addEventListener('click', function(){
    var b = tightDataBounds();
    manualRange = {xlo:b.xlo, xhi:b.xhi, ylo:b.ylo, yhi:b.yhi};
    $('ugt-cv-xmax').value = numStr(b.xhi); $('ugt-cv-ymax').value = numStr(b.yhi);
    drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Autoscaled to fit the data.');
  });
  $('ugt-cv-range-auto0').addEventListener('click', function(){
    var b = tightDataBounds();
    var xlo = Math.min(b.xlo, 0), xhi = Math.max(b.xhi, 0);
    var ylo = Math.min(b.ylo, 0), yhi = Math.max(b.yhi, 0);
    manualRange = {xlo:xlo, xhi:xhi, ylo:ylo, yhi:yhi};
    $('ugt-cv-xmax').value = numStr(xhi); $('ugt-cv-ymax').value = numStr(yhi);
    drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Autoscaled with the (0, 0) origin shown.');
  });

  function cvBounds(){
    var xlo=Infinity,xhi=-Infinity,ylo=Infinity,yhi=-Infinity;
    // combine every *visible* data set's points — but if there's fewer than 2 real points on the
    // graph altogether (e.g. a still-blank Student table), fall back to the current preset's own
    // range instead of bounding on a page of blank/zeroed rows
    var totalPoints = 0;
    datasets.forEach(function(ds){ if(ds.visible) totalPoints += ds.points.length; });
    if(totalPoints < 2){
      CURVES[cvType].data.forEach(function(d){
        xlo=Math.min(xlo,d.x-d.ex); xhi=Math.max(xhi,d.x+d.ex);
        ylo=Math.min(ylo,d.y-d.ey); yhi=Math.max(yhi,d.y+d.ey);
      });
    } else {
      datasets.forEach(function(ds){
        if(!ds.visible) return;
        ds.points.forEach(function(d){
          xlo=Math.min(xlo,d.x-d.ex); xhi=Math.max(xhi,d.x+d.ex);
          ylo=Math.min(ylo,d.y-d.ey); yhi=Math.max(yhi,d.y+d.ey);
        });
      });
    }
    var e=cvXExtent();
    [e.min, e.max].forEach(function(x){ var y=curveY(x); if(isFinite(y)){ ylo=Math.min(ylo,y); yhi=Math.max(yhi,y); } });
    ylo=Math.min(ylo,0);
    return {xlo:xlo,xhi:xhi,ylo:ylo,yhi:yhi};
  }

  function sizeCurvePlot(){
    var w = ccan.clientWidth || 760;
    var h = ccan.clientHeight || Math.round(w*0.625);
    h = Math.max(360, h);
    cW=w; cH=h;
    ccan.width=Math.round(w*DPR); ccan.height=Math.round(h*DPR);
    cctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function drawCurvePlot(){
    if(!tan) resetTangent();
    var multiFit = multiFitActive();
    var padL=58, padR=16, padT=14, padB=46;
    var b = cvBounds();
    var validRange = manualRange && isFinite(manualRange.xlo) && isFinite(manualRange.xhi)
      && isFinite(manualRange.ylo) && isFinite(manualRange.yhi)
      && manualRange.xhi>manualRange.xlo && manualRange.yhi>manualRange.ylo;
    var ax, ay;
    if(validRange){
      ax = {lo:manualRange.xlo, hi:manualRange.xhi, step:niceStep(manualRange.xlo, manualRange.xhi)};
      ay = {lo:manualRange.ylo, hi:manualRange.yhi, step:niceStep(manualRange.ylo, manualRange.yhi)};
    } else {
      ax = niceAxis(b.xlo, b.xhi); ay = niceAxis(b.ylo, b.yhi);
    }
    var x0=ax.lo, x1=ax.hi, y0=ay.lo, y1=ay.hi;
    var plotW = cW-padL-padR, plotH = cH-padT-padB;
    function sx(x){ return padL + (x-x0)/(x1-x0)*plotW; }
    function sy(y){ return padT + (1-(y-y0)/(y1-y0))*plotH; }
    function dxFromPx(px){ return x0 + (px-padL)/plotW*(x1-x0); }
    function dyFromPx(py){ return y0 + (1-(py-padT)/plotH)*(y1-y0); }
    cvPlot = {sx:sx,sy:sy,dx:dxFromPx,dy:dyFromPx,x0:x0,x1:x1,y0:y0,y1:y1,padL:padL,padT:padT,plotW:plotW,plotH:plotH};

    cctx.clearRect(0,0,cW,cH);
    cctx.fillStyle='#ffffff'; cctx.fillRect(0,0,cW,cH);

    // grid
    cctx.lineWidth=1;
    var gx, gy;
    cctx.strokeStyle='#e6eef0';
    for(gx=x0; gx<=x1+1e-9; gx+=ax.step/5){ var X=sx(gx); cctx.beginPath(); cctx.moveTo(X,padT); cctx.lineTo(X,padT+plotH); cctx.stroke(); }
    for(gy=y0; gy<=y1+1e-9; gy+=ay.step/5){ var Y=sy(gy); cctx.beginPath(); cctx.moveTo(padL,Y); cctx.lineTo(padL+plotW,Y); cctx.stroke(); }
    cctx.strokeStyle='#cdd9dd';
    for(gx=x0; gx<=x1+1e-9; gx+=ax.step){ var X2=sx(gx); cctx.beginPath(); cctx.moveTo(X2,padT); cctx.lineTo(X2,padT+plotH); cctx.stroke(); }
    for(gy=y0; gy<=y1+1e-9; gy+=ay.step){ var Y2=sy(gy); cctx.beginPath(); cctx.moveTo(padL,Y2); cctx.lineTo(padL+plotW,Y2); cctx.stroke(); }

    // axes
    cctx.strokeStyle='#16222c'; cctx.lineWidth=1.5;
    cctx.beginPath(); cctx.moveTo(padL,padT); cctx.lineTo(padL,padT+plotH); cctx.lineTo(padL+plotW,padT+plotH); cctx.stroke();

    // tick labels
    cctx.fillStyle='#42505c'; cctx.font='11px ui-monospace,monospace';
    cctx.textAlign='center'; cctx.textBaseline='top';
    for(gx=x0; gx<=x1+1e-9; gx+=ax.step){ cctx.fillText(fmt(gx,3), sx(gx), padT+plotH+6); }
    cctx.textAlign='right'; cctx.textBaseline='middle';
    for(gy=y0; gy<=y1+1e-9; gy+=ay.step){ cctx.fillText(fmt(gy,3), padL-6, sy(gy)); }

    // axis titles
    var xl=$('ugt-cv-xlab').value, xu=$('ugt-cv-xunit').value, yl=$('ugt-cv-ylab').value, yu=$('ugt-cv-yunit').value;
    cctx.fillStyle='#16222c'; cctx.font='600 12px Segoe UI,system-ui,sans-serif';
    cctx.textAlign='center'; cctx.textBaseline='bottom';
    cctx.fillText(xl + (xu?(' / '+xu):''), padL+plotW/2, cH-4);
    cctx.save();
    cctx.translate(13, padT+plotH/2); cctx.rotate(-Math.PI/2);
    cctx.textBaseline='top';
    cctx.fillText(yl + (yu?(' / '+yu):''), 0, 0);
    cctx.restore();

    // line(s) of best fit — each data set independently chooses (via its chip's "fit shown" toggle)
    // whether to show its own fit, drawn in that data set's own colour and spanning only its own
    // x-range; the active data set (whichever is in the table right now) is drawn a touch thicker.
    // A non-active data set that's never been actively edited is fitted fresh each draw; one that
    // has remembers its own fitParams (see dsFitParams) so a hand-shaped "fit by eye" curve survives
    // switching away and back.
    cctx.save(); cctx.beginPath(); cctx.rect(padL,padT,plotW,plotH); cctx.clip();
    var steps=140;
    datasets.forEach(function(ds, dsi){
      if(!ds.visible || !ds.showFit) return;
      var params = dsFitParams(dsi, ds);
      if(!params) return;
      var xsDS = ds.points.map(function(d){ return d.x; });
      var dsMin = Math.min.apply(null, xsDS), dsMax = Math.max.apply(null, xsDS);
      if(!isFinite(dsMin) || !isFinite(dsMax)) return;
      dsMin = Math.min(dsMin, x0); dsMax = Math.max(dsMax, x1);
      cctx.strokeStyle = ds.color; cctx.lineWidth = (dsi===activeDataset) ? 2.4 : 1.8; cctx.beginPath();
      for(var i=0;i<=steps;i++){
        var xx = dsMin + (dsMax-dsMin)*i/steps;
        var yy = CURVES[cvType].y(params, xx);
        if(!isFinite(yy)) continue;
        if(i===0) cctx.moveTo(sx(xx),sy(yy)); else cctx.lineTo(sx(xx),sy(yy));
      }
      cctx.stroke();
    });

    // saved minimum/maximum GRADIENT lines (linear mode) — drawn alongside each data set's own
    // line of best fit once "Save as Minimum/Maximum Gradient" has been used for it. Each data set
    // remembers its own pair (dsMinLine/dsMaxLine), so these are drawn for EVERY visible data set
    // that has one, regardless of multiFit — only the trial-line tools used to CREATE a new pair are
    // disabled while 2+ fits are shown at once (same restriction as the tangent tools below), not
    // the lines already saved elsewhere. Always drawn in the fixed minimum/maximum colours (red/
    // blue) — the movable results box below spells out which data set each dashed line belongs to,
    // numbered "Data set (N)" to match.
    if(CURVES[cvType].isLinear){
      datasets.forEach(function(ds, dsi){
        if(!ds.visible || !ds.showFit) return;
        var dsMinL = dsMinLine(dsi, ds), dsMaxL = dsMaxLine(dsi, ds);
        if(!dsMinL && !dsMaxL) return;
        var xsDS2 = ds.points.map(function(d){ return d.x; });
        var dsMinX = Math.min.apply(null, xsDS2), dsMaxX = Math.max.apply(null, xsDS2);
        if(!isFinite(dsMinX) || !isFinite(dsMaxX)) return;
        dsMinX = Math.min(dsMinX, x0); dsMaxX = Math.max(dsMaxX, x1);
        [ [dsMinL,COLOR_MIN], [dsMaxL,COLOR_MAX] ].forEach(function(pair){
          var line = pair[0], color = pair[1];
          if(!line) return;
          cctx.strokeStyle=color; cctx.lineWidth=2; cctx.setLineDash([7,5]);
          cctx.beginPath();
          cctx.moveTo(sx(dsMinX), sy(line.m*dsMinX+line.c));
          cctx.lineTo(sx(dsMaxX), sy(line.m*dsMaxX+line.c));
          cctx.stroke(); cctx.setLineDash([]);
        });
      });
    }

    // tangent / trial line — drawn as a full ruled line across the whole plot (a real tangent, not a
    // stub), passing through the point of tangency (curved modes) or freely positioned (linear mode)
    // at the slope you've set with the handle. Hidden while "Show tangent" is toggled off, or while
    // 2+ data sets are each showing their own line of best fit (multiFit).
    var ext = (tan && tangentVisible && !multiFit) ? tangentExtended() : null;
    if(tan && tangentVisible && !multiFit){
      cctx.strokeStyle='#c87f12'; cctx.lineWidth=2.4; cctx.setLineDash([]);
      cctx.beginPath();
      cctx.moveTo(sx(ext.x1), sy(ext.y1));
      cctx.lineTo(sx(ext.x2), sy(ext.y2));
      cctx.stroke();
    }

    // small helper so a label always sits on a readable background, regardless of what's behind it
    function labelWithBg(text, x, y, align, baseline, font, color){
      cctx.font = font; cctx.textAlign = align; cctx.textBaseline = baseline;
      var w = cctx.measureText(text).width, padX=4, h=15;
      var boxX = align==='center' ? x-w/2-padX : (align==='left' ? x-padX : x-w-padX);
      var boxY = baseline==='top' ? y-2 : (baseline==='bottom' ? y-h : y-h/2-1);
      cctx.fillStyle='rgba(255,255,255,.88)';
      cctx.fillRect(boxX, boxY, w+2*padX, h+3);
      cctx.fillStyle=color;
      cctx.fillText(text, x, y);
    }

    // ghost rise/run triangle — spans the FULL length of tangent you've dragged out (pivot to handle,
    // end to end, not just half), and its right-angle corner always sits on the low side, so the wedge
    // reads as "below" the line
    if(tan && tangentVisible && !multiFit){
      var Ax=tan.x1, Ay=tan.y1, Cx=tan.x2, Cy=tan.y2;
      var run = Cx-Ax, rise = Cy-Ay;
      if(Math.abs(run)>1e-9 || Math.abs(rise)>1e-9){
        // corner shares C's y (and A's x) when the line falls left-to-right, else shares A's y (and C's x) —
        // whichever keeps the corner at the lower data-value, i.e. visually below the hypotenuse
        var cornerAtStart = rise < 0;
        var Bx = cornerAtStart ? Ax : Cx, By = cornerAtStart ? Cy : Ay;
        var sAx=sx(Ax),sAy=sy(Ay), sBx=sx(Bx),sBy=sy(By), sCx=sx(Cx),sCy=sy(Cy);
        // filled wedge (all three sides, fill only — the hypotenuse is already drawn as the solid tangent line)
        cctx.beginPath();
        cctx.moveTo(sAx,sAy); cctx.lineTo(sBx,sBy); cctx.lineTo(sCx,sCy); cctx.closePath();
        cctx.fillStyle='rgba(200,127,18,.14)'; cctx.fill();
        // the two ghost legs only, dashed
        cctx.setLineDash([5,4]); cctx.strokeStyle='rgba(200,127,18,.85)'; cctx.lineWidth=1.6;
        cctx.beginPath(); cctx.moveTo(sAx,sAy); cctx.lineTo(sBx,sBy); cctx.lineTo(sCx,sCy); cctx.stroke();
        cctx.setLineDash([]);
        // right-angle tick at B, pointing inward (toward the triangle's interior) on both legs
        var tick=7;
        var sgX = ((sAx+sCx)/2 >= sBx) ? 1 : -1, sgY = ((sAy+sCy)/2 >= sBy) ? 1 : -1;
        cctx.strokeStyle='rgba(200,127,18,.85)'; cctx.lineWidth=1.2;
        cctx.beginPath(); cctx.moveTo(sBx+sgX*tick,sBy); cctx.lineTo(sBx+sgX*tick,sBy+sgY*tick); cctx.lineTo(sBx,sBy+sgY*tick); cctx.stroke();

        cctx.font='600 11px Segoe UI,system-ui,sans-serif';
        // "run" label along the horizontal leg — always at y=By, spanning Ax..Cx, offset well clear
        // of the leg (and boxed) so it never sits on top of the tangent line itself
        var runMidX=(sAx+sCx)/2;
        var runBelow = (sAy+sCy)/2 < sBy;
        labelWithBg('run = '+fmt(run,3)+(xu?(' '+xu):''), runMidX, sBy + (runBelow ? -18 : 18),
          'center', runBelow?'bottom':'top', '600 11px Segoe UI,system-ui,sans-serif', '#8a5a0d');
        // "rise" label along the vertical leg — always at x=Bx, spanning Ay..Cy, offset to the side
        // of the triangle that's away from the tangent line
        var riseMidY=(sAy+sCy)/2;
        var riseLeftSide = (sAx+sCx)/2 < sBx;
        labelWithBg('rise = '+fmt(rise,3)+(yu?(' '+yu):''), sBx + (riseLeftSide ? -14 : 14), riseMidY,
          riseLeftSide?'right':'left', 'middle', '600 11px Segoe UI,system-ui,sans-serif', '#8a5a0d');

        // gradient — placed clear of the wedge, just past its lowest (screen-y, i.e. furthest-down) corner
        var gunit2 = (yu||xu) ? ((yu||'1')+(xu?(' '+xu+'⁻¹'):'')) : '';
        var gLabel = 'gradient = rise/run = '+fmt(run!==0?rise/run:0,4)+(gunit2?(' '+gunit2):'');
        var gY = Math.max(sAy,sBy,sCy) + 20, gX = sBx;
        var gLeft = (sAx+sCx)/2 >= sBx;
        cctx.font='700 12px Segoe UI,system-ui,sans-serif';
        cctx.textAlign = gLeft ? 'left' : 'right'; cctx.textBaseline='top';
        var tw=cctx.measureText(gLabel).width, padBg=5;
        var boxX = gLeft ? gX-padBg : gX-tw-padBg;
        cctx.fillStyle='rgba(255,255,255,.9)';
        cctx.fillRect(boxX, gY-3, tw+2*padBg, 20);
        cctx.fillStyle='#0a615d';
        cctx.fillText(gLabel, gX, gY);
      }
    }
    cctx.restore();

    // data points + error bars — every visible data set, each drawn in its own colour; the data
    // set currently active (shown in the table) is drawn marginally larger as a subtle "editing
    // this one" cue. A selected point (rubber-band selected, pending deletion — only ever possible
    // in the active data set's own table) gets a soft amber ring behind it.
    datasets.forEach(function(ds, dsi){
      if(!ds.visible) return;
      var isActiveDS = dsi === activeDataset, r = isActiveDS ? 3.6 : 3.1;
      ds.points.forEach(function(d, di){
        var X=sx(d.x), Y=sy(d.y);
        if(isActiveDS && cvSelected.indexOf(di)>=0){
          cctx.beginPath(); cctx.arc(X,Y,8,0,2*Math.PI);
          cctx.fillStyle='rgba(200,127,18,.22)'; cctx.fill();
          cctx.strokeStyle='#c87f12'; cctx.lineWidth=1.6; cctx.stroke();
        }
        cctx.strokeStyle='rgba(22,34,44,.55)'; cctx.lineWidth=1.2;
        if(d.ey){ var yA=sy(d.y+d.ey), yB=sy(d.y-d.ey);
          cctx.beginPath(); cctx.moveTo(X,yA); cctx.lineTo(X,yB);
          cctx.moveTo(X-4,yA); cctx.lineTo(X+4,yA); cctx.moveTo(X-4,yB); cctx.lineTo(X+4,yB); cctx.stroke(); }
        if(d.ex){ var xA=sx(d.x+d.ex), xB=sx(d.x-d.ex);
          cctx.beginPath(); cctx.moveTo(xA,Y); cctx.lineTo(xB,Y);
          cctx.moveTo(xA,Y-4); cctx.lineTo(xA,Y+4); cctx.moveTo(xB,Y-4); cctx.lineTo(xB,Y+4); cctx.stroke(); }
        // marked with an × rather than a dot — the traditional convention for a plotted reading,
        // since a dot's centre is ambiguous but the crossing point of an × pins down the exact
        // (x, y) position. Drawn as a white halo underneath the coloured cross for legibility
        // against the grid and any line passing behind it.
        var s = r + 1.3;
        cctx.lineCap = 'round';
        cctx.strokeStyle = '#fff'; cctx.lineWidth = isActiveDS ? 3.8 : 3.3;
        cctx.beginPath();
        cctx.moveTo(X-s,Y-s); cctx.lineTo(X+s,Y+s);
        cctx.moveTo(X-s,Y+s); cctx.lineTo(X+s,Y-s);
        cctx.stroke();
        cctx.strokeStyle = ds.color; cctx.lineWidth = isActiveDS ? 2.1 : 1.8;
        cctx.beginPath();
        cctx.moveTo(X-s,Y-s); cctx.lineTo(X+s,Y+s);
        cctx.moveTo(X-s,Y+s); cctx.lineTo(X+s,Y-s);
        cctx.stroke();
        cctx.lineCap = 'butt';
      });
    });

    // live rubber-band selection rectangle
    if(cvSelectRect){
      cctx.save();
      cctx.fillStyle='rgba(14,140,134,.10)';
      cctx.strokeStyle='rgba(14,140,134,.9)'; cctx.lineWidth=1.2; cctx.setLineDash([5,4]);
      var rrx=cvSelectRect.x0, rry=cvSelectRect.y0, rrw=cvSelectRect.x1-cvSelectRect.x0, rrh=cvSelectRect.y1-cvSelectRect.y0;
      cctx.fillRect(rrx,rry,rrw,rrh); cctx.strokeRect(rrx,rry,rrw,rrh);
      cctx.restore();
    }

    // draggable Bezier-style handles (freeformfit only) — one per data point; the dashed line
    // shows the handle's offset from its knot, and its height reflects the curve's local slope there
    if(CURVES[cvType].bezierEditable && cvParams && cvParams.xs && cvParams.xs.length){
      cctx.save();
      for(var bi=0; bi<cvParams.xs.length; bi++){
        var bKx=cvParams.xs[bi], bKy=cvParams.ys[bi];
        var bReach = cvBezierReachData(bi);
        var bHx = bKx+bReach, bHy = bKy + cvParams.m[bi]*bReach;
        var bKX=sx(bKx), bKY=sy(bKy), bHX=sx(bHx), bHY=sy(bHy);
        cctx.strokeStyle='rgba(108,79,181,.55)'; cctx.lineWidth=1.4; cctx.setLineDash([3,3]);
        cctx.beginPath(); cctx.moveTo(bKX,bKY); cctx.lineTo(bHX,bHY); cctx.stroke();
        cctx.setLineDash([]);
        var hs=5;
        cctx.fillStyle = (cvDrag==='bezierHandle' && cvBezierDragIndex===bi) ? '#4a3583' : '#6c4fb5';
        cctx.fillRect(bHX-hs,bHY-hs,hs*2,hs*2);
        cctx.strokeStyle='#fff'; cctx.lineWidth=1.2; cctx.strokeRect(bHX-hs,bHY-hs,hs*2,hs*2);
      }
      cctx.restore();
    }

    var isLin = !!CURVES[cvType].isLinear;

    // mean point marker (linear mode, "Identify mean point") — separate from the draggable
    // trial line, since in linear mode the trial line's ends are both free to move
    if(isLin && meanPointShown){
      var mp = meanPoint(), mX=sx(mp.x), mY=sy(mp.y), r=7;
      cctx.beginPath();
      cctx.moveTo(mX,mY-r); cctx.lineTo(mX+r,mY); cctx.lineTo(mX,mY+r); cctx.lineTo(mX-r,mY); cctx.closePath();
      cctx.fillStyle='#5b5fb0'; cctx.fill(); cctx.strokeStyle='#fff'; cctx.lineWidth=1.8; cctx.stroke();
      labelWithBg('mean point (x̄, ȳ) = ('+fmt(mp.x,3)+', '+fmt(mp.y,3)+')', mX+12, mY,
        'left', 'middle', '600 11px Segoe UI,system-ui,sans-serif', '#3f4390');
    }

    // pivot + free-end handle of the trial/tangent line — hidden while "Show tangent" is off,
    // or while multiFit is active (dragging is disabled then, via cvHitTest)
    if(tan && tangentVisible && !multiFit){
      var pX=sx(tan.x1), pY=sy(tan.y1);
      cctx.beginPath(); cctx.arc(pX,pY,7,0,2*Math.PI); cctx.fillStyle=COLOR_PIVOT; cctx.fill();
      cctx.strokeStyle='#fff'; cctx.lineWidth=2; cctx.stroke();
      // sits on the side of the pivot opposite the wedge, whichever way the tangent runs
      var runSign = (tan.x2-tan.x1) >= 0;
      labelWithBg(isLin ? 'drag either end' : 'green point — drag me', pX + (runSign?-12:12), pY,
        runSign?'right':'left', 'middle', '600 11px Segoe UI,system-ui,sans-serif', COLOR_PIVOT);
      // tangent free-end handle
      cctx.beginPath(); cctx.arc(sx(tan.x2),sy(tan.y2),6,0,2*Math.PI);
      cctx.fillStyle='#fff'; cctx.fill(); cctx.strokeStyle='#c87f12'; cctx.lineWidth=2.4; cctx.stroke();
    }

    // small helper for the boxed, top-left summary panel — reused by both the single-line
    // (tangent / line-of-best-fit) summary and the multiFit per-data-set summary below
    function drawFitSummaryBox(boxTitle, lines){
      var bPadX=10, bPadY=8, lineH=16, titleH=17;
      cctx.font='700 12px Segoe UI,system-ui,sans-serif';
      var maxW = cctx.measureText(boxTitle).width;
      cctx.font='600 12px ui-monospace,monospace';
      lines.forEach(function(l){ maxW = Math.max(maxW, cctx.measureText(l.text).width); });
      var boxW = maxW + bPadX*2, boxH = titleH + lines.length*lineH + bPadY*1.6;
      var boxDefX = padL + 10, boxDefY = padT + 10;
      // draggable — see the pointerdown/pointermove handlers below — because the results box can
      // otherwise land on top of data points
      var boxX, boxY;
      if(summaryBoxPos){
        boxX = Math.max(padL, Math.min(padL+plotW-boxW, summaryBoxPos.x));
        boxY = Math.max(padT, Math.min(padT+plotH-boxH, summaryBoxPos.y));
      } else {
        boxX = boxDefX; boxY = boxDefY;
      }
      summaryBoxRect = {x:boxX, y:boxY, w:boxW, h:boxH};
      cctx.fillStyle='rgba(255,255,255,.94)';
      cctx.strokeStyle='#cdd9dd'; cctx.lineWidth=1;
      cctx.beginPath();
      if(cctx.roundRect){ cctx.roundRect(boxX,boxY,boxW,boxH,8); } else { cctx.rect(boxX,boxY,boxW,boxH); }
      cctx.fill(); cctx.stroke();
      cctx.fillStyle='#9aa7ab'; cctx.font='9px Segoe UI,system-ui,sans-serif';
      cctx.textAlign='right'; cctx.textBaseline='top';
      cctx.fillText('move ⠿', boxX+boxW-6, boxY+3);
      cctx.fillStyle='#16222c'; cctx.font='700 12px Segoe UI,system-ui,sans-serif';
      cctx.textAlign='left'; cctx.textBaseline='top';
      cctx.fillText(boxTitle, boxX+bPadX, boxY+bPadY);
      cctx.font='600 12px ui-monospace,monospace';
      lines.forEach(function(l,i){ cctx.fillStyle=l.color; cctx.fillText(l.text, boxX+bPadX, boxY+bPadY+titleH+i*lineH); });
    }

    if(isLin){
      // every visible data set that's showing its own line of best fit is listed here, each tagged
      // "Data set (N)" by its position among all data sets (N = 1, 2, …) — with the on-canvas legend
      // gone, this movable results box is now the only place that identifies which colour-coded line
      // belongs to which data set, so it always lists every one shown rather than only once 2+ are
      // on screen at once. Each data set's own saved minimum/maximum gradient lines are listed right
      // underneath it, in full (m and c, both with units) — matching how the best-fit line itself is
      // shown, and giving the best-fit line a ± uncertainty once that data set has both saved.
      var xuF=$('ugt-cv-xunit').value, yuF=$('ugt-cv-yunit').value;
      var gunitF = (yuF||xuF) ? ((yuF||'1')+(xuF?(' '+xuF+'⁻¹'):'')) : '';
      var fitLines = [];
      var fitDSCount = 0;
      datasets.forEach(function(ds, dsi){
        if(!ds.visible || !ds.showFit) return;
        var p = dsFitParams(dsi, ds);
        if(!p) return;
        fitDSCount++;
        var tag = 'Data set ('+(dsi+1)+')';
        var dmnF = dsMinLine(dsi, ds), dmxF = dsMaxLine(dsi, ds);
        var haveMinMaxF = !!(dmnF && dmxF);
        var halfMF = haveMinMaxF ? Math.abs(dmxF.m-dmnF.m)/2 : 0;
        var halfCF = haveMinMaxF ? Math.abs(dmxF.c-dmnF.c)/2 : 0;
        fitLines.push({text:tag+': m = '+fmt(p.m,4)+(haveMinMaxF?(' ± '+fmt(halfMF,2)):'')+(gunitF?(' '+gunitF):'')+', c = '+fmt(p.c,4)+(haveMinMaxF?(' ± '+fmt(halfCF,2)):'')+(yuF?(' '+yuF):''), color:ds.color});
        if(dmnF) fitLines.push({text:tag+' minimum: m = '+fmt(dmnF.m,4)+(gunitF?(' '+gunitF):'')+', c = '+fmt(dmnF.c,4)+(yuF?(' '+yuF):''), color:COLOR_MIN});
        if(dmxF) fitLines.push({text:tag+' maximum: m = '+fmt(dmxF.m,4)+(gunitF?(' '+gunitF):'')+', c = '+fmt(dmxF.c,4)+(yuF?(' '+yuF):''), color:COLOR_MAX});
      });
      if(fitLines.length) drawFitSummaryBox(fitDSCount>1?'Lines of best fit':'Line of best fit', fitLines); else summaryBoxRect = null;
    } else if(!multiFit && tan && tangentVisible){
      // curved (non-linear) mode: the tangent-at-a-point summary for the active data set only —
      // the tangent tools only ever apply to one data set at a time (see multiFitActive), so there's
      // nothing to number here; this follows "Show tangent" and is hidden once 2+ curved fits are
      // shown at once, same as the tangent line itself
      var xuB=$('ugt-cv-xunit').value, yuB=$('ugt-cv-yunit').value;
      var gunitB = (yuB||xuB) ? ((yuB||'1')+(xuB?(' '+xuB+'⁻¹'):'')) : '';
      var mStudB = (tan.x2-tan.x1)!==0 ? (tan.y2-tan.y1)/(tan.x2-tan.x1) : 0;
      var cStudB = tangentIntercept(mStudB);
      var lines = [
        {text:'gradient m = '+fmt(mStudB,4)+(gunitB?(' '+gunitB):''), color:'#0a615d'},
        {text:'y-intercept c = '+fmt(cStudB,4)+(yuB?(' '+yuB):''), color:'#0a615d'}
      ];
      if(cvRevealed){
        var mTrueB = curveSlope(tan.x1), cTrueB = tangentIntercept(mTrueB);
        lines.push({text:'true gradient = '+fmt(mTrueB,4)+(gunitB?(' '+gunitB):''), color:'#0a615d'});
        lines.push({text:'true y-intercept = '+fmt(cTrueB,4)+(yuB?(' '+yuB):''), color:'#0a615d'});
      }
      drawFitSummaryBox('Gradient & intercept', lines);
    } else {
      summaryBoxRect = null;
    }
  }

  // y-intercept of the student's tangent line, extended back to x = 0 — c in y = mx + c
  function tangentIntercept(m){
    return tan.y1 - m*tan.x1;
  }

  function updateCurveReadout(){
    if(!tan) return;
    var xu=$('ugt-cv-xunit').value, yu=$('ugt-cv-yunit').value;
    var gunit = (yu||xu) ? ((yu||'1')+(xu?(' '+xu+'⁻¹'):'')) : '';
    if(CURVES[cvType].isLinear){ updateLinearReadout(xu,yu,gunit); return; }
    if(multiFitActive()){
      var htmlM = datasetStatusNote();
      htmlM += '<div class="ugt-gradient-box">';
      htmlM += '<div class="ugt-step">2 or more data sets are each showing their own line of best fit (see the graph). The tangent-at-a-point tools only make sense for one curve at a time, so they\'re greyed out while this is the case — use "Hide line of best fit" on all but one data set to use them again.</div>';
      htmlM += '</div>';
      $('ugt-cv-out').innerHTML = htmlM;
      return;
    }
    var mStud = (tan.x2-tan.x1)!==0 ? (tan.y2-tan.y1)/(tan.x2-tan.x1) : 0;
    var cStud = tangentIntercept(mStud);
    var html = datasetStatusNote();
    html += '<div class="ugt-gradient-box">';
    html += '<div class="ugt-step">point of tangency = ('+fmt(tan.x1,3)+', '+fmt(tan.y1,3)+')</div>';
    html += '<div class="ugt-step">your tangent: Δy = '+fmt(tan.y2-tan.y1,3)+' · Δx = '+fmt(tan.x2-tan.x1,3)+'</div>';
    html += resultPill('gradient m = '+fmt(mStud,4), '', gunit);
    html += ' ' + resultPill('y-intercept c = '+fmt(cStud,4), '', yu||'');
    html += '</div>';
    if(cvRevealed){
      var mTrue = curveSlope(tan.x1);
      var cTrue = tangentIntercept(mTrue);
      var diff = Math.abs(mStud-mTrue);
      var pc = mTrue!==0 ? Math.abs(diff/mTrue*100) : 0;
      var good = pc <= 10;
      html += '<div class="ugt-gradient-box">';
      html += '<div class="ugt-step">true gradient (from the fitted curve, dy/dx) = <b>'+fmt(mTrue,4)+(gunit?(' '+gunit):'')+'</b>, true y-intercept = <b>'+fmt(cTrue,4)+(yu?(' '+yu):'')+'</b></div>';
      html += '<div class="ugt-tag '+(good?'ugt-tag-good':'ugt-tag-warn')+'">Your tangent is '+fmt(pc,3)+'% from the true gradient at this point'+(good?' — a good match.':' — try rotating the tangent so it just touches the curve without crossing it.')+'</div>';
      html += '</div>';
    }
    $('ugt-cv-out').innerHTML = html;
  }

  // readout for the linear mode: best-fit line, mean point, current trial line, and — once both
  // saved — the gradient/intercept with an uncertainty from the min/max construction lines
  function updateLinearReadout(xu, yu, gunit){
    if(multiFitActive()){
      var htmlF = datasetStatusNote();
      htmlF += '<div class="ugt-gradient-box">';
      htmlF += '<div class="ugt-step">Each data set below is showing its own line of best fit, colour-matched to the graph and numbered to match the movable results box on it:</div>';
      datasets.forEach(function(ds, dsi){
        if(!ds.visible || !ds.showFit) return;
        var p = dsFitParams(dsi, ds);
        if(!p) return;
        htmlF += '<div class="ugt-step" style="color:'+ds.color+'">Data set ('+(dsi+1)+') — '+ds.label+': ' +
          resultPill('gradient m = '+fmt(p.m,4), '', gunit) + ' ' + resultPill('y-intercept c = '+fmt(p.c,4), '', yu||'') + '</div>';
      });
      htmlF += '</div>';
      htmlF += '<div class="ugt-step" style="margin-top:4px">The minimum/maximum gradient construction and tangent tools only apply to a single line at a time, so they\'re greyed out while 2 or more data sets are each showing a line of best fit — hide all but one to use them again.</div>';
      $('ugt-cv-out').innerHTML = htmlF;
      return;
    }
    var mBest = cvParams.m, cBest = cvParams.c;
    var mTrial = (tan.x2-tan.x1)!==0 ? (tan.y2-tan.y1)/(tan.x2-tan.x1) : 0;
    var cTrial = tan.y1 - mTrial*tan.x1;
    var haveMinMax = !!(minLine && maxLine);
    var halfM = haveMinMax ? Math.abs(maxLine.m-minLine.m)/2 : 0;
    var halfC = haveMinMax ? Math.abs(maxLine.c-minLine.c)/2 : 0;
    var html = datasetStatusNote();
    html += '<div class="ugt-gradient-box" style="color:'+COLOR_BEST+'">';
    html += '<div class="ugt-step" style="color:'+COLOR_BEST+'">line of best fit (least-squares regression) — black on the graph'+(haveMinMax?', with an uncertainty from your minimum/maximum lines':'')+':</div>';
    html += resultPill('gradient m = '+fmt(mBest,4), haveMinMax?fmt(halfM,2):'', gunit);
    html += ' ' + resultPill('y-intercept c = '+fmt(cBest,4), haveMinMax?fmt(halfC,2):'', yu||'');
    html += '</div>';
    if(meanPointShown){
      var mp = meanPoint();
      html += '<div class="ugt-step">mean point (x̄, ȳ) = ('+fmt(mp.x,3)+', '+fmt(mp.y,3)+') — the line of best fit should pass close to this point.</div>';
    }
    if(tangentVisible){
      html += '<div class="ugt-gradient-box">';
      html += '<div class="ugt-step">your trial line: Δy = '+fmt(tan.y2-tan.y1,3)+' · Δx = '+fmt(tan.x2-tan.x1,3)+'</div>';
      html += resultPill('trial gradient = '+fmt(mTrial,4), '', gunit);
      html += ' ' + resultPill('trial y-intercept = '+fmt(cTrial,4), '', yu||'');
      html += '<div class="ugt-step" style="margin-top:4px">Drag the line to the steepest line that still passes through every error bar and click <span style="color:'+COLOR_MAX+';font-weight:700">“Save as Maximum Gradient”</span> (blue); then the shallowest such line and <span style="color:'+COLOR_MIN+';font-weight:700">“Save as Minimum Gradient”</span> (red). Click “Hide tangent” once both are saved for a clean graph.</div>';
      html += '</div>';
    }
    if(minLine || maxLine){
      html += '<div class="ugt-gradient-box">';
      if(minLine) html += '<div class="ugt-step" style="color:'+COLOR_MIN+'">minimum gradient = '+fmt(minLine.m,4)+(gunit?(' '+gunit):'')+', y-intercept = '+fmt(minLine.c,4)+(yu?(' '+yu):'')+'</div>';
      if(maxLine) html += '<div class="ugt-step" style="color:'+COLOR_MAX+'">maximum gradient = '+fmt(maxLine.m,4)+(gunit?(' '+gunit):'')+', y-intercept = '+fmt(maxLine.c,4)+(yu?(' '+yu):'')+'</div>';
      if(haveMinMax){
        var lo=Math.min(minLine.m,maxLine.m), hi=Math.max(minLine.m,maxLine.m);
        var within = mBest >= lo-1e-9 && mBest <= hi+1e-9;
        html += '<div class="ugt-tag '+(within?'ugt-tag-good':'ugt-tag-warn')+'">'+(within?'The best-fit gradient falls between your minimum and maximum lines — a good pair.':'The best-fit gradient falls outside your min/max lines — adjust them so both still touch the error bars but bracket the best-fit line.')+'</div>';
      }
      html += '</div>';
    }
    $('ugt-cv-out').innerHTML = html;
  }

  function cvCanvasXY(ev){
    var r = ccan.getBoundingClientRect();
    return {x: ev.clientX - r.left, y: ev.clientY - r.top};
  }
  function cvHitTest(px,py){
    if(!cvPlot || !tan || !tangentVisible || multiFitActive()) return null;
    var targets = [['pivot', tan.x1, tan.y1], ['handle', tan.x2, tan.y2]];
    for(var i=0;i<targets.length;i++){
      var hx=cvPlot.sx(targets[i][1]), hy=cvPlot.sy(targets[i][2]);
      if((px-hx)*(px-hx)+(py-hy)*(py-hy) < 220){ return targets[i][0]; }
    }
    return null;
  }
  // which part of the canvas the cursor is over, for axis-drag affordances: the bulk of each axis
  // strip pans that axis, while the strip's high-value end (last ~18%) zooms/rescales it instead
  function cvAxisZone(px, py){
    if(!cvPlot) return null;
    var padL=cvPlot.padL, padT=cvPlot.padT, plotW=cvPlot.plotW, plotH=cvPlot.plotH;
    if(py > padT+plotH && py <= cH && px >= padL && px <= padL+plotW){
      var fracX = (px-padL)/plotW; // 0 at the low (left) end, 1 at the high (right) end
      return {axis:'x', mode: fracX >= 0.82 ? 'zoom' : 'pan'};
    }
    if(px >= 0 && px < padL && py >= padT && py <= padT+plotH){
      var fracY = 1-(py-padT)/plotH; // 0 at the low (bottom) end, 1 at the high (top) end
      return {axis:'y', mode: fracY >= 0.82 ? 'zoom' : 'pan'};
    }
    return null;
  }
  function updateSelectUI(){
    var btn = $('ugt-cv-select-del');
    if(!btn) return;
    var n = cvSelected.length;
    btn.textContent = n ? ('Delete selected ('+n+')') : 'Delete selected';
    btn.disabled = !n;
    var fitBtn = $('ugt-cv-select-fit');
    if(fitBtn){
      fitBtn.textContent = n>=2 ? ('Fit to selected ('+n+')') : 'Fit to selected';
      fitBtn.disabled = n < 2;
    }
    var fitAllBtn = $('ugt-cv-select-fitall');
    if(fitAllBtn) fitAllBtn.disabled = !(datasets[activeDataset] && datasets[activeDataset].fitPinned);
  }
  // "fit by eye" free-form curve: each data point gets one draggable handle, always rendered a
  // fixed pixel distance to the right of its knot — dragging it up/down sets the curve's local
  // steepness there (the underlying maths is the same monotone-cubic spline as the auto-fitted
  // Free-form option; here the per-knot slope m[i] is set by hand instead of computed automatically)
  function cvBezierReachData(i){
    var REACH_PX = 34;
    if(!cvPlot || !cvParams || !cvParams.xs) return 1;
    var kx = cvParams.xs[i];
    var reach = cvPlot.dx(cvPlot.sx(kx)+REACH_PX) - kx;
    return reach || 1e-6;
  }
  function cvBezierHandleData(i){
    var kx=cvParams.xs[i], ky=cvParams.ys[i], m=cvParams.m[i];
    var reach = cvBezierReachData(i);
    return {x: kx+reach, y: ky+m*reach};
  }
  function cvBezierHitTest(px,py){
    if(!cvPlot || !CURVES[cvType].bezierEditable || !cvParams || !cvParams.xs) return null;
    for(var i=0;i<cvParams.xs.length;i++){
      var hd = cvBezierHandleData(i);
      var hx=cvPlot.sx(hd.x), hy=cvPlot.sy(hd.y);
      if((px-hx)*(px-hx)+(py-hy)*(py-hy) < 160) return i;
    }
    return null;
  }
  // shared by the click-to-plot tab's "click (no drag) adds a point" gesture; on the other tabs
  // CLICK_TO_PLOT is never true so this is defined but never actually called
  function cvAddPointAt(px, py){
    if(!cvPlot) return;
    var nx = roundSig(cvPlot.dx(px), 3), ny = roundSig(cvPlot.dy(py), 3);
    cvDataDirty = true;
    var exAll = num($('ugt-cv-ex-all').value), eyAll = num($('ugt-cv-ey-all').value);
    cvData.push({x:nx, y:ny, ex:exAll||0, ey:eyAll||0});
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Added point ('+fmt(nx,3)+', '+fmt(ny,3)+') from the graph.');
  }
  ccan.addEventListener('pointerdown', function(ev){
    var p=cvCanvasXY(ev);
    // the results box is drawn on top of everything else, so grabbing it always wins over a point
    // underneath it — check this before any other hit-test
    if(summaryBoxRect && p.x>=summaryBoxRect.x && p.x<=summaryBoxRect.x+summaryBoxRect.w && p.y>=summaryBoxRect.y && p.y<=summaryBoxRect.y+summaryBoxRect.h){
      cvDrag = 'summaryBox';
      summaryBoxDrag = {offX: p.x-summaryBoxRect.x, offY: p.y-summaryBoxRect.y};
      ccan.style.cursor = 'grabbing';
      try{ ccan.setPointerCapture(ev.pointerId); }catch(e){ /* see the axis-drag capture above */ }
      ev.preventDefault();
      return;
    }
    var bHit = cvBezierHitTest(p.x,p.y);
    if(bHit !== null){
      cvDrag='bezierHandle'; cvBezierDragIndex=bHit;
      try{ ccan.setPointerCapture(ev.pointerId); }catch(e){ /* see the axis-drag capture above */ }
      ev.preventDefault();
      return;
    }
    var hit=cvHitTest(p.x,p.y);
    if(hit){ cvDrag=hit; ccan.setPointerCapture(ev.pointerId); ev.preventDefault(); return; }
    var zone = cvAxisZone(p.x, p.y);
    if(zone){
      if(!manualRange){
        var bSeed = cvBounds();
        var axSeed = niceAxis(bSeed.xlo, bSeed.xhi), aySeed = niceAxis(bSeed.ylo, bSeed.yhi);
        manualRange = {xlo:axSeed.lo, xhi:axSeed.hi, ylo:aySeed.lo, yhi:aySeed.hi};
      }
      cvDrag = zone.axis + (zone.mode==='zoom' ? 'zoom' : 'pan');
      cvAxisDragStart = {px:p.x, py:p.y, range:{xlo:manualRange.xlo,xhi:manualRange.xhi,ylo:manualRange.ylo,yhi:manualRange.yhi}, plot:cvPlot};
      ccan.style.cursor = zone.mode==='zoom' ? (zone.axis==='x'?'ew-resize':'ns-resize') : 'grabbing';
      try{ ccan.setPointerCapture(ev.pointerId); }catch(e){ /* e.g. a synthetic or already-released pointer — the drag still works via document-level moves */ }
      ev.preventDefault();
      return;
    }
    if(cvPlot && p.x>=cvPlot.padL && p.x<=cvPlot.padL+cvPlot.plotW && p.y>=cvPlot.padT && p.y<=cvPlot.padT+cvPlot.plotH){
      cvDrag = 'select';
      cvSelectStart = {px:p.x, py:p.y};
      cvSelectRect = null;
      ccan.style.cursor = 'crosshair';
      try{ ccan.setPointerCapture(ev.pointerId); }catch(e){ /* see the axis-drag capture above */ }
      ev.preventDefault();
    }
  });
  ccan.addEventListener('pointermove', function(ev){
    var p=cvCanvasXY(ev);
    if(!cvDrag){
      // hover feedback only — a pan cursor over most of an axis strip, a resize cursor near its
      // high-value end (last ~18%), a pointer over the draggable pivot/handle, default elsewhere
      if(!cvPlot){ ccan.style.cursor=''; return; }
      if(summaryBoxRect && p.x>=summaryBoxRect.x && p.x<=summaryBoxRect.x+summaryBoxRect.w && p.y>=summaryBoxRect.y && p.y<=summaryBoxRect.y+summaryBoxRect.h){ ccan.style.cursor = 'grab'; return; }
      var hoverZone = cvAxisZone(p.x, p.y);
      if(hoverZone){ ccan.style.cursor = hoverZone.mode==='zoom' ? (hoverZone.axis==='x'?'ew-resize':'ns-resize') : 'grab'; }
      else if(cvBezierHitTest(p.x,p.y)!==null){ ccan.style.cursor = 'ns-resize'; }
      else if(cvHitTest(p.x,p.y)){ ccan.style.cursor = 'pointer'; }
      else if(p.x>=cvPlot.padL && p.x<=cvPlot.padL+cvPlot.plotW && p.y>=cvPlot.padT && p.y<=cvPlot.padT+cvPlot.plotH){ ccan.style.cursor = 'crosshair'; }
      else { ccan.style.cursor = ''; }
      return;
    }
    if(cvDrag==='summaryBox'){
      if(!summaryBoxDrag) return;
      summaryBoxPos = {x: p.x-summaryBoxDrag.offX, y: p.y-summaryBoxDrag.offY};
      drawCurvePlot();
      return;
    }
    if(cvDrag==='xpan' || cvDrag==='xzoom' || cvDrag==='ypan' || cvDrag==='yzoom'){
      if(!cvAxisDragStart) return;
      var plot = cvAxisDragStart.plot, r0 = cvAxisDragStart.range;
      if(cvDrag==='xpan'){
        var pxPerData = plot.plotW/((r0.xhi-r0.xlo)||1);
        var deltaData = (p.x-cvAxisDragStart.px)/pxPerData;
        manualRange.xlo = r0.xlo - deltaData; manualRange.xhi = r0.xhi - deltaData;
      } else if(cvDrag==='ypan'){
        var pxPerDataY = plot.plotH/((r0.yhi-r0.ylo)||1);
        var deltaDataY = (p.y-cvAxisDragStart.py)/pxPerDataY;
        manualRange.ylo = r0.ylo + deltaDataY; manualRange.yhi = r0.yhi + deltaDataY;
      } else if(cvDrag==='xzoom'){
        var newXhi = r0.xlo + (p.x-plot.padL)/plot.plotW*(r0.xhi-r0.xlo);
        if(newXhi - manualRange.xlo > 1e-9) manualRange.xhi = newXhi;
      } else {
        var newYhi = r0.ylo + (1-(p.y-plot.padT)/plot.plotH)*(r0.yhi-r0.ylo);
        if(newYhi - manualRange.ylo > 1e-9) manualRange.yhi = newYhi;
      }
      drawCurvePlot(); updateCurveReadout();
      return;
    }
    if(cvDrag==='select'){
      if(!cvSelectStart || !cvPlot) return;
      var ddx = p.x-cvSelectStart.px, ddy = p.y-cvSelectStart.py;
      if(!cvSelectRect && (ddx*ddx+ddy*ddy) < 25) return; // still within the click-vs-drag threshold
      var rx0 = Math.max(cvPlot.padL, Math.min(cvSelectStart.px, p.x));
      var rx1 = Math.min(cvPlot.padL+cvPlot.plotW, Math.max(cvSelectStart.px, p.x));
      var ry0 = Math.max(cvPlot.padT, Math.min(cvSelectStart.py, p.y));
      var ry1 = Math.min(cvPlot.padT+cvPlot.plotH, Math.max(cvSelectStart.py, p.y));
      cvSelectRect = {x0:rx0, y0:ry0, x1:rx1, y1:ry1};
      cvSelected = [];
      cvData.forEach(function(d,di){
        var X=cvPlot.sx(d.x), Y=cvPlot.sy(d.y);
        if(X>=rx0 && X<=rx1 && Y>=ry0 && Y<=ry1) cvSelected.push(di);
      });
      updateSelectUI();
      drawCurvePlot();
      return;
    }
    if(cvDrag==='bezierHandle'){
      if(!cvPlot || !cvParams || !cvParams.xs || cvBezierDragIndex==null) return;
      var bKy = cvParams.ys[cvBezierDragIndex];
      var bReachD = cvBezierReachData(cvBezierDragIndex);
      var bNy = cvPlot.dy(p.y);
      if(Math.abs(bReachD) > 1e-9){ cvParams.m[cvBezierDragIndex] = (bNy - bKy) / bReachD; }
      resyncPivot();
      drawCurvePlot(); updateCurveReadout();
      return;
    }
    if(!cvPlot||!tan) return;
    var nx=cvPlot.dx(p.x), ny=cvPlot.dy(p.y);
    if(cvDrag==='pivot' && !CURVES[cvType].isLinear){
      var e=cvXExtent();
      var cx = Math.max(e.min, Math.min(e.max, nx));
      var cy = curveY(cx);
      var ddx = cx - tan.x1, ddy = cy - tan.y1; // rigid translation — keeps the student's chosen slope
      tan.x1 = cx; tan.y1 = cy; tan.x2 += ddx; tan.y2 += ddy;
      pivotX = cx;
    } else if(cvDrag==='pivot'){
      // linear mode: no fixed "point of tangency" — both ends of the trial line are free,
      // so it can be dragged to touch whichever error bars the student chooses
      tan.x1 = nx; tan.y1 = ny;
    } else {
      tan.x2 = nx; tan.y2 = ny;
    }
    drawCurvePlot(); updateCurveReadout();
  });
  function cvEndDrag(){ cvDrag=null; cvAxisDragStart=null; cvSelectRect=null; cvBezierDragIndex=null; summaryBoxDrag=null; }
  ccan.addEventListener('pointerup', function(ev){
    var wasSelectDrag = (cvDrag==='select' && cvSelectRect);
    if(cvDrag==='select' && !cvSelectRect){
      // never crossed the drag threshold — a plain click
      if(typeof CLICK_TO_PLOT !== 'undefined' && CLICK_TO_PLOT){
        cvAddPointAt(cvSelectStart.px, cvSelectStart.py);
      } else if(cvSelected.length){
        cvSelected = []; updateSelectUI(); drawCurvePlot();
      }
    }
    cvEndDrag();
    if(wasSelectDrag) drawCurvePlot(); // clear the (now-stale) live selection rectangle
  });
  ccan.addEventListener('pointercancel', cvEndDrag);
  // bulk actions on the data table: delete just the selected points, or wipe the table entirely
  $('ugt-cv-select-del').addEventListener('click', function(){
    if(!cvSelected.length) return;
    cvDataDirty = true;
    var n = cvSelected.length;
    cvSelected.slice().sort(function(a,b){ return b-a; }).forEach(function(i){ cvData.splice(i,1); });
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Deleted '+n+' point(s).');
  });
  // fit the curve using only the currently rubber-band-selected points — lets a messy data set
  // (e.g. one with a few wild outliers) still get a sensible line, by highlighting just the points
  // you trust, fitting to those, then the highlight clears automatically but the fitted line stays
  // on the graph. The fit is "pinned" to that subset (see refitCurve) until "Refit to all points".
  $('ugt-cv-select-fit').addEventListener('click', function(){
    if(cvSelected.length < 2) return;
    var subset = cvSelected.map(function(i){ return cvData[i]; }).filter(Boolean);
    if(subset.length < 2) return;
    var fitted;
    try{ fitted = CURVES[cvType].fit(subset); }catch(e){ fitted = null; }
    if(!fitted){ flashStatus($('ugt-cv-d-status'), 'Could not fit a curve to just those points — try selecting a few more.'); return; }
    cvParams = fitted;
    var n = cvSelected.length;
    if(datasets[activeDataset]){ datasets[activeDataset].fitParams = cvParams; datasets[activeDataset].fitPinned = true; }
    cvSelected = []; updateSelectUI();
    resyncPivot();
    renderDatasetChips(); updateDatasetButtons();
    drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Fitted the curve to the '+n+' selected point(s) only — the highlight is cleared but the line stays. Use "Refit to all points" to go back to fitting every point in this data set.');
  });
  $('ugt-cv-select-fitall').addEventListener('click', function(){
    if(!datasets[activeDataset] || !datasets[activeDataset].fitPinned) return;
    datasets[activeDataset].fitPinned = false;
    refitCurve(); resyncPivot();
    renderDatasetChips(); updateDatasetButtons();
    drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Refitted using every point in this data set.');
  });
  $('ugt-cv-clearall').addEventListener('click', function(){
    // clears only the active data set's points — matching "Add point", typing, and "Delete
    // selected", which likewise only ever touch the data set currently shown in the table
    if(!cvData.length) return;
    cvDataDirty = true;
    cvData = [];
    datasets[activeDataset].points = cvData;
    datasets[activeDataset].fitPinned = false;
    datasets[activeDataset].minLine = null; datasets[activeDataset].maxLine = null;
    minLine = null; maxLine = null; meanPointShown = false;
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
    flashStatus($('ugt-cv-d-status'), 'Cleared all data points.');
  });


  /* ---------- init ---------- */
  loadCurve('expdecay');

  // ResizeObserver for the curve canvas
  var ro = new ResizeObserver(function(){ sizeCurvePlot(); drawCurvePlot(); });
  ro.observe(root);
})();

</main></div></div></body></html>
</script>

<script>
(function(){

  // Click-to-plot variant: the student builds the data table by clicking directly

  /* ---------- number helpers ---------- */
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }

    var a = Math.abs(x);

  function uSig(){ return boardMode==='wjec' ? 2 : 1; }
  function supNum(n){

    return String(n).split('').map(function(c){ return map[c]||c; }).join('');

    var sf=uSig();

      if(Math.abs(uR-u1) <= Math.abs(uR)*1e-9){ return {uR:u1, dp:decimalsOf(u1,1)}; }

  }
  function fmtPair(value, unc){
    if(!isFinite(value)) return {v:'—', u:'—'};
    var U=Math.abs(unc);

    var a=Math.abs(value), ref=a>0?a:U;

  }
  function pairPill(value, unc, unit, label){
    var p=fmtPair(value, unc);

  }
  // % uncertainty computed from the *quoted* (rounded) uncertainty, so it always agrees with the value ± uncertainty pill shown alongside it
  function pctUnc(value, unc){

    return Math.abs(uncRoundDP(U).uR / value * 100);
  }


  function niceAxis(lo, hi){
    if(lo===hi){ lo-=1; hi+=1; }
    var range = hi-lo;
    var step = Math.pow(10, Math.floor(Math.log10(range/5)));
    var err = (range/5)/step;
    if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
    var nlo = Math.floor(lo/step)*step, nhi = Math.ceil(hi/step)*step;

  }
  // step size only, for an axis range the student has set explicitly — the requested lo/hi are
  // used exactly as given (no outward rounding to a "nice" multiple), only the gridline spacing is chosen
  function niceStep(lo, hi){
    var range = Math.abs(hi-lo) || 1;
    var step = Math.pow(10, Math.floor(Math.log10(range/5)));
    var err = (range/5)/step;
    if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;

  }

  // so "Autoscale" can zoom right in on the data with no forced origin

    var cvSrc = cvData.length>=2 ? cvData : CURVES[cvType].data;
    cvSrc.forEach(function(d){

    [e.min, e.max].forEach(function(x){ var y=curveY(x); if(isFinite(y)){ ylo=Math.min(ylo,y); yhi=Math.max(yhi,y); } });

  /* ---------- data save / load / CSV export (shared by the two graph tabs) ---------- */
  // Wrapped so a browser with storage disabled (private mode, some embeds) degrades gracefully instead of throwing.

  // published Claude artifact, a plain <a download> link is silently blocked by the viewer
  // sandbox — so this goes through Claude's own "downloads" capability there instead, which pops
  // a normal save confirmation. When it's running as an ordinary HTML file (opened directly, or
  // the copy you exchange with your colleague), window.claude isn't present at all, so it just
  // falls back to the standard browser download link, exactly as before.
  var claudeDownloadsCap = (typeof window !== 'undefined' && window.claude && window.claude.use)

    : Promise.resolve(null);
  function plainLinkDownload(filename, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

  function offerDownload(filename, blob){
    claudeDownloadsCap.then(function(downloads){
      if(downloads && downloads.save){
        downloads.save({filename:filename, data:blob}).catch(function(err){

          // back to a plain link if the capability genuinely isn't usable in this view at all
          var code = err && err.code;

          }

        plainLinkDownload(filename, blob);
      }
    });
  }
  function downloadCSV(filename, rows){
    var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    offerDownload(filename, blob);
  }
  // minimal RFC4180-ish CSV parser: handles quoted fields, embedded commas/quotes/newlines, \r\n or \n
  function parseCSVText(text){
    var rows=[], row=[], field='', inQuotes=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQuotes){
        if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
        else field+=c;
      } else {
        if(c==='"') inQuotes=true;
        else if(c===','){ row.push(field); field=''; }
        else if(c==='\r'){ /* skip, \n follows */ }

  }
  // pulls "Label / unit" back apart the way our own CSV export writes header cells
  function splitLabUnit(cell){

  }

  // it carries "Label / unit" text, used to refill the axis-label fields) whenever its own x/y cells
  // aren't themselves numbers — a header-less file (just numbers) is read from row 1 with no fuss
  function parseImportedCSV(text){
    var rows = parseCSVText(text);
    if(!rows.length) return null;
    var start = 0, axis = null;
    var c0 = parseFloat(rows[0][0]), c1 = parseFloat(rows[0][1]);
    if(!(isFinite(c0) && isFinite(c1))){

      axis = {xlab:xlu.lab, xunit:xlu.unit, ylab:ylu.lab, yunit:ylu.unit};
      start = 1;

    for(var i=start; i<rows.length; i++){
      var r = rows[i];
      var x = parseFloat(r[0]), y = parseFloat(r[1]);
      if(!isFinite(x) || !isFinite(y)) continue; // skip blank/stray rows rather than fail the whole import

  =================================================================== */
  var ccan = $('ugt-curveplot'), cctx = ccan.getContext('2d');
  var cW=520, cH=390, cvPlot=null, cvDrag=null;
  var cvAxisDragStart = null; // {px,py,range,plot} captured when an axis pan/zoom drag starts
  var cvSelected = [];    // indices into cvData currently selected (for "Delete selected")
  var cvSelectRect = null; // {x0,y0,x1,y1} in canvas px, drawn live while rubber-band-selecting
  var cvSelectStart = null; // {px,py} where a plot-interior pointerdown began

  // least squares, y = m·x + c
  function linReg(xs, ys){
    var n=xs.length, sx=0,sy=0,sxy=0,sxx=0;
    for(var i=0;i<n;i++){ sx+=xs[i]; sy+=ys[i]; sxy+=xs[i]*ys[i]; sxx+=xs[i]*xs[i]; }

      if(d[i-1]===0 || d[i]===0 || (d[i-1]>0)!==(d[i]>0)) m[i]=0;
      else m[i] = 2*d[i-1]*d[i]/(d[i-1]+d[i]); // harmonic mean — standard PCHIP choice
    }

  }

  function splineY(S, x){

      return {min:Math.min.apply(null,pxs), max:Math.max.apply(null,pxs)};

  // after a refit, re-anchor the pivot onto the (possibly now-different) curve at the same x,
  // translating the tangent rigidly so the student's own slope survives the data edit
  function resyncPivot(){

    var newY = curveY(pivotX);

    // than 2 usable points) the tangent can be sitting on NaN — a rigid translation would only

  $('ugt-cv-d-csv-import-btn').addEventListener('click', function(){ $('ugt-cv-d-csv-import').click(); });
  $('ugt-cv-d-csv-import').addEventListener('change', function(){

    reader.onload = function(){

      } else {

      }

    };
    reader.onerror = function(){ flashStatus($('ugt-cv-d-status'), 'Could not read that file.'); $('ugt-cv-d-csv-import').value=''; };
    reader.readAsText(file);
  });

  function loadCurve(type){
    cvType = type;
    var C = CURVES[type];
    if(CLICK_TO_PLOT){
      cvData = [];
    } else if(STUDENT_MODE){
      cvData = [];
      for(var bi=0; bi<8; bi++) cvData.push({x:'', y:'', ex:'', ey:''});
    } else {
      cvData = C.data.map(function(d){ return {x:d.x,y:d.y,ex:d.ex,ey:d.ey}; });
    }
    cvDataDirty = false;
    summaryBoxPos = null;
    minLine = null; maxLine = null; meanPointShown = false;
    manualRange = null; $('ugt-cv-xmax').value=''; $('ugt-cv-ymax').value='';
    tangentVisible = true; $('ugt-cv-showtan').textContent = 'Hide tangent';
    $('ugt-cv-xlab').value = C.xlab; $('ugt-cv-xunit').value = C.xunit;
    $('ugt-cv-ylab').value = C.ylab; $('ugt-cv-yunit').value = C.yunit;
    refitCurve();
    var e=cvXExtent(); pivotX = e.min + (e.max-e.min)/2;
    resetTangent();
    updateModeUI();
    renderCurveDataTable();
    drawCurvePlot(); updateCurveReadout();
  }
  // switching the "curve shape" / fit-type dropdown: if the student has already entered their own
  // data, keep it and just refit to the new model — only load a fresh preset/blank table when the
  // data table is still exactly as it was left after the last preset/blank load
  $('ugt-cv-type').addEventListener('change', function(){
    var newType = this.value;

      flashStatus($('ugt-cv-d-status'), 'Switched fit type — your data was kept.');
    } else {
      loadCurve(newType);
    }
  });
  ['ugt-cv-xlab','ugt-cv-xunit','ugt-cv-ylab','ugt-cv-yunit'].forEach(function(id){ $(id).addEventListener('input', function(){ drawCurvePlot(); updateCurveReadout(); }); });
  var cvRevealed = false;
  $('ugt-cv-reveal').addEventListener('click', function(){

  $('ugt-cv-savemin').addEventListener('click', function(){

    minLine = {m:m, c:tan.y1 - m*tan.x1};

  });
  $('ugt-cv-savemax').addEventListener('click', function(){
