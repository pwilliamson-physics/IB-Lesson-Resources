<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphical Analysis Toolkit</title>
<style>
  :root{
    --ink:#16222c; --ink-soft:#42505c; --line:#ccd6dd;
    --paper:#e9eef2; --card:#fbfcfd; --card-edge:#dde5ea;
    --bezel:#15303a; --bezel-2:#0e242c; --bezel-ink:#cfe6e6;
    --teal:#0e8c86; --teal-d:#0a615d; --teal-soft:#d6ecea;
    --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    -webkit-text-size-adjust:100%;
  }
  .gat-wrap{ max-width:1060px; margin:0 auto; padding:18px 14px 34px; }
  .gat-bezel{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(150deg,var(--bezel),var(--bezel-2));
    color:#fff; padding:16px 18px; border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(12,30,36,.18);
  }
  .gat-title{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em; }
  .gat-sub{ margin:2px 0 0; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--bezel-ink); opacity:.85; }
  .gat-tabs{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 12px; justify-content:center; }
  .gat-tab{
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--ink-soft);
    background:var(--card); border:1px solid var(--card-edge); border-radius:9px;
    padding:12px 30px; min-width:200px; text-align:center; cursor:pointer; transition:all .12s ease;
  }
  .gat-tab:hover{ color:var(--ink); border-color:var(--teal); }
  .gat-tab.active{
    color:#fff; background:var(--teal); border-color:var(--teal-d);
    box-shadow:0 2px 8px rgba(14,140,134,.28);
  }
  .gat-tab:focus-visible{ outline:3px solid #c87f12; outline-offset:2px; }
  .gat-frame-wrap{
    overflow:hidden;
  }
  .gat-frame-wrap iframe{
    width:100%; height:900px; border:0; display:none; background:var(--paper);
  }
  .gat-frame-wrap iframe.active{ display:block; }
  .gat-footer{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:20px; }
  @media (max-width:720px){
    .gat-title{ font-size:18px; }
    .gat-bezel{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="gat-wrap">

  <header class="gat-bezel">
    <div>
      <h1 class="gat-title">Graphical Analysis Toolkit</h1>
      <p class="gat-sub">Uncertainties, curve fitting &amp; tangents &middot; Chemistry Practical Skills</p>
    </div>
  </header>

  <div class="gat-tabs" role="tablist">
    <button type="button" class="gat-tab active" data-target="teacher" role="tab" aria-selected="true">Teacher exemplar</button>
    <button type="button" class="gat-tab" data-target="student" role="tab" aria-selected="false">Student worksheet</button>
    <button type="button" class="gat-tab" data-target="click" role="tab" aria-selected="false">Student &mdash; click to plot</button>
  </div>

  <div class="gat-frame-wrap">
    <iframe id="frame-teacher" class="active" title="Teacher exemplar"></iframe>
    <iframe id="frame-student" title="Student worksheet"></iframe>
    <iframe id="frame-click" title="Student, click to plot"></iframe>
  </div>

  <div class="gat-footer">Science Department &middot; Refined with AI</div>
</div>

<script type="text/plain" id="tpl-teacher">
<!DOCTYPE html>
<html lang="en-GB"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non-linear data — Teacher exemplar</title>
</head>
<body style="margin:0">

<div id="ugt-root">
  <div class="ugt-shell">

    <main class="ugt-stage">


         <section class="ugt-panel ugt-active" data-panel="curve" role="tabpanel">
        <div class="ugt-card">
          <h2 class="ugt-h" id="ugt-cv-h2">Curved graphs &amp; the gradient at a point</h2>
          <p class="ugt-p" id="ugt-cv-method">Many experiments yield <b>non-linear data</b>, not a straight line — the gradient then only has meaning <b>at a single instantaneous point</b>. Drag the point to choose where on the curve you want the gradient, then drag the tangent's free end until the line just touches the curve there. A shaded triangle marks the <b>rise</b> and <b>run</b> along your tangent — gradient = rise ÷ run.</p>

          <div class="ugt-field ugt-highlight-box">
            <label class="ugt-lab" for="ugt-cv-type">Curve shape</label>
            <span class="ugt-hint" style="display:block;margin:-4px 0 6px">Click and drag on the graph to select points (e.g. an erroneous reading). Use “Delete selected” to remove them, or “Fit to selected” to fit the curve using only those points — the highlight clears but the line stays.</span>
            <select id="ugt-cv-type" class="ugt-in">
              <option value="linear">Straight line — y = mx + c</option>
              <option value="expdecay" selected>Exponential decay — y = A·e^(−x/τ)</option>
              <option value="inv">Inverse — y = k / x</option>
              <option value="invsq">Inverse square — y = k / x²</option>
              <option value="plateau">Growth to a plateau — y = A(1 − e^(−x/τ))</option>
              <option value="logdecay">Slow decay towards zero — y = A / (1 + x/τ)</option>
              <option value="freeform">Free-form — any shape (e.g. rises then falls)</option>
              <option value="freeformfit">Free-form — fit by eye (drag the curve to your data)</option>
            </select>
          </div>

          <p class="ugt-p" id="ugt-cv-example" style="font-style:italic;margin:-4px 0 14px"></p>

          <div class="ugt-graph-layout">
            <div class="ugt-plot-wrap"><canvas id="ugt-curveplot" class="ugt-canvas" width="1832" height="1144"></canvas></div>
            <div class="ugt-plot-tools">
              <button id="ugt-cv-snap" class="ugt-btn ugt-btn-ghost">Find tangent at green point</button>
              <button id="ugt-cv-showtan" class="ugt-btn ugt-btn-ghost">Hide tangent</button>
              <button id="ugt-cv-mean" class="ugt-btn ugt-btn-ghost" hidden>Identify mean point</button>
              <button id="ugt-cv-savemin" class="ugt-btn ugt-btn-ghost" hidden>Save as Minimum Gradient</button>
              <button id="ugt-cv-savemax" class="ugt-btn ugt-btn-ghost" hidden>Save as Maximum Gradient</button>
              <button id="ugt-cv-download" class="ugt-btn ugt-btn-ghost">Download graph as image</button>
              <button id="ugt-cv-select-del" class="ugt-btn ugt-btn-ghost ugt-btn-danger" type="button" disabled>Delete selected</button>
              <button id="ugt-cv-select-fit" class="ugt-btn ugt-btn-ghost" type="button" disabled>Fit to selected</button>
              <button id="ugt-cv-select-fitall" class="ugt-btn ugt-btn-ghost" type="button" disabled>Refit to all points</button>
              <button id="ugt-cv-clearall" class="ugt-btn ugt-btn-ghost ugt-btn-danger" type="button">Clear all</button>
            </div>

            <div class="ugt-data-row">
              <div class="ugt-left-col">
                <div class="ugt-axis-fields">
                  <div class="ugt-field"><label class="ugt-lab">x-axis label</label><input id="ugt-cv-xlab" class="ugt-in" type="text" value="Time t"></div>
                  <div class="ugt-field ugt-unitf"><label class="ugt-lab">x unit</label><input id="ugt-cv-xunit" class="ugt-in" type="text" value="s"></div>
                  <div class="ugt-field"><label class="ugt-lab">y-axis label</label><input id="ugt-cv-ylab" class="ugt-in" type="text" value="Count rate R"></div>
                  <div class="ugt-field ugt-unitf"><label class="ugt-lab">y unit</label><input id="ugt-cv-yunit" class="ugt-in" type="text" value="s⁻¹"></div>
                </div>
                <div class="ugt-range-block">
                  <label class="ugt-lab">Plot from (0, 0) up to:</label>
                  <div class="ugt-inline" style="margin-top:4px">
                    <input id="ugt-cv-xmax" class="ugt-in ugt-in-sm" type="number" step="any" placeholder="x max">
                    <input id="ugt-cv-ymax" class="ugt-in ugt-in-sm" type="number" step="any" placeholder="y max">
                    <button id="ugt-cv-range-set" class="ugt-btn ugt-btn-ghost" type="button">Set range</button>
                  </div>
                  <div class="ugt-inline" style="margin-top:6px">
                    <button id="ugt-cv-range-auto" class="ugt-btn ugt-btn-ghost" type="button">Autoscale</button>
                    <button id="ugt-cv-range-auto0" class="ugt-btn ugt-btn-ghost" type="button">Autoscale (0,0 origin)</button>
                  </div>
                  <span class="ugt-hint">Set range plots from (0, 0) up to the highest x/y you give. Autoscale fits tightly to your current data; Autoscale (0,0 origin) does the same but always keeps the origin in view.</span>
                </div>
              </div>
              <div class="ugt-data-block">
                <div class="ugt-unc-all">
                  <label class="ugt-lab">Set a fixed ± for every point (e.g. an instrumental uncertainty)</label>
                  <div class="ugt-inline">
                    <input id="ugt-cv-ex-all" class="ugt-in ugt-in-sm" type="number" step="any" placeholder="±x">
                    <input id="ugt-cv-ey-all" class="ugt-in ugt-in-sm" type="number" step="any" placeholder="±y">
                    <button id="ugt-cv-unc-apply" class="ugt-btn ugt-btn-ghost" type="button">Apply to all points</button>
                  </div>
                  <span class="ugt-hint">Leave a box blank to only set the other one. Tip: you can also paste a whole column of numbers copied from a spreadsheet straight into the table &mdash; click the first cell, then paste.</span>
                </div>
                <div class="ugt-table-wrap ugt-data-scroll">
                  <table class="ugt-table ugt-data-table" id="ugt-cv-d-tab">
                    <thead><tr><th>x</th><th>y</th><th>±x</th><th>±y</th><th></th></tr></thead>
                    <tbody id="ugt-cv-d-body"></tbody>
                  </table>
                </div>
                <button id="ugt-cv-d-add" class="ugt-btn ugt-btn-ghost">Add point</button>

                <div class="ugt-dataset-row">
                  <div class="ugt-dataset-chips" id="ugt-ds-chips"></div>
                  <div class="ugt-dataset-btns">
                    <button id="ugt-ds-add" class="ugt-btn ugt-btn-ghost" type="button">Add new data set</button>
                    <button id="ugt-ds-show" class="ugt-btn ugt-btn-ghost" type="button" disabled>Show data set on graph</button>
                    <button id="ugt-ds-color" class="ugt-btn ugt-btn-ghost" type="button" disabled>Assign colour</button>
                  </div>
                  <div class="ugt-color-picker" id="ugt-ds-palette" hidden></div>
                </div>

                <div class="ugt-data-io">
                  <button id="ugt-cv-d-save" class="ugt-btn ugt-btn-ghost">Save data</button>
                  <button id="ugt-cv-d-load" class="ugt-btn ugt-btn-ghost">Load saved data</button>
                  <button id="ugt-cv-d-csv" class="ugt-btn ugt-btn-ghost">Export as CSV</button>
                  <button id="ugt-cv-d-csv-import-btn" class="ugt-btn ugt-btn-ghost">Import CSV</button>
                  <input id="ugt-cv-d-csv-import" type="file" accept=".csv,text/csv" style="display:none">
                  <span id="ugt-cv-d-status" class="ugt-hint"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="ugt-readout-head">
            <h3 class="ugt-h3" id="ugt-readout-h3">Gradient at green point</h3>
            <button id="ugt-cv-reveal" class="ugt-btn ugt-btn-ghost">Reveal true gradient</button>
          </div>
          <div id="ugt-cv-out" class="ugt-readout"></div>
        </div>
      </section>


<style>
  #ugt-root{
    --ink:#16222c; --ink-soft:#42505c; --line:#ccd6dd;
    --paper:#e9eef2; --card:#fbfcfd; --card-edge:#dde5ea;
    --bezel:#15303a; --bezel-2:#0e242c; --bezel-ink:#cfe6e6;
    --teal:#0e8c86; --teal-d:#0a615d; --teal-soft:#d6ecea;
    --rose:#d6336c; --amber:#c87f12; --amber-soft:#faecd5; --violet:#5b5fb0;
    --good:#0e8c86; --warn:#c0392b;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    box-sizing:border-box; min-height:620px;
    font-family:var(--sans); color:var(--ink); line-height:1.5;
    background:var(--paper);
    -webkit-text-size-adjust:100%;
  }
  #ugt-root *{ box-sizing:border-box; }
  #ugt-root [hidden]{ display:none !important; }
  #ugt-root .ugt-shell{
    max-width:980px; margin:0 auto; padding:14px;
    min-height:620px;
  }

  /* ---- bezel header ---- */
  #ugt-root .ugt-bezel{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(150deg,var(--bezel),var(--bezel-2));
    color:#fff; padding:16px 18px; border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(12,30,36,.18);
  }
  #ugt-root .ugt-bezel-mark{
    font-family:var(--mono); font-size:34px; font-weight:700; line-height:1;
    width:54px; height:54px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    color:var(--bezel-ink); border:2px solid rgba(207,230,230,.4); border-radius:10px;
    background:rgba(255,255,255,.04);
  }
  #ugt-root .ugt-bezel-text{ flex:1 1 auto; min-width:0; }
  #ugt-root .ugt-title{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em; color:#fff; }
  #ugt-root .ugt-sub{ margin:2px 0 0; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--bezel-ink); opacity:.85; }
  #ugt-root .ugt-bezel-lamp{
    width:11px; height:11px; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 35%, #7ff0c9, var(--teal));
    box-shadow:0 0 8px rgba(14,140,134,.8);
  }

  /* ---- tabs ---- */
  #ugt-root .ugt-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  #ugt-root .ugt-tab{
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--ink-soft);
    background:var(--card); border:1px solid var(--card-edge); border-radius:9px;
    padding:9px 13px; cursor:pointer; transition:all .12s ease;
  }
  #ugt-root .ugt-tab:hover{ color:var(--ink); border-color:var(--teal); }
  #ugt-root .ugt-tab.ugt-active{
    color:#fff; background:var(--teal); border-color:var(--teal-d);
    box-shadow:0 2px 8px rgba(14,140,134,.28);
  }
  #ugt-root .ugt-tab:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }

  /* ---- panels ---- */
  #ugt-root .ugt-panel{ display:none; }
  #ugt-root .ugt-panel.ugt-active{ display:block; }
  #ugt-root .ugt-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  #ugt-root .ugt-card{
    background:var(--card); border:1px solid var(--card-edge); border-radius:12px;
    padding:16px 16px 18px; margin-bottom:14px;
    box-shadow:0 2px 6px rgba(20,40,50,.05);
  }
  #ugt-root .ugt-h{ margin:0 0 6px; font-size:16px; font-weight:700; letter-spacing:-.01em; }
  #ugt-root .ugt-h::before{
    content:""; display:inline-block; width:8px; height:8px; border-radius:2px;
    background:var(--teal); margin-right:8px; vertical-align:middle;
  }
  #ugt-root .ugt-p{ margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); }
  #ugt-root .ugt-mono{ font-family:var(--mono); font-size:.94em; background:var(--teal-soft); padding:1px 5px; border-radius:4px; color:var(--teal-d); white-space:nowrap; }

  /* ---- form controls ---- */
  #ugt-root .ugt-field{ margin-bottom:11px; }
  /* calls out the curve-shape picker specifically — it's easy to leave on the wrong model and not
     notice, since every other control still works, it just fits the wrong data */
  #ugt-root .ugt-field.ugt-highlight-box{
    background:var(--amber-soft); border:1px solid var(--amber); border-left-width:4px;
    border-radius:9px; padding:10px 12px 12px; margin-bottom:14px;
  }
  #ugt-root .ugt-highlight-box .ugt-lab{ color:#8a5a0d; }
  #ugt-root .ugt-inline{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #ugt-root .ugt-lab{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; letter-spacing:.01em; }
  #ugt-root .ugt-in{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink);
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  #ugt-root .ugt-in-sm{ width:120px; }
  #ugt-root .ugt-area{ resize:vertical; font-family:var(--mono); font-size:13px; }
  #ugt-root .ugt-in:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  #ugt-root .ugt-hint{ font-size:11.5px; color:var(--ink-soft); }

  #ugt-root .ugt-btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:#fff;
    background:var(--teal); border:1px solid var(--teal-d); border-radius:8px;
    padding:9px 14px; cursor:pointer; transition:filter .12s ease; margin:2px 6px 2px 0;
  }
  #ugt-root .ugt-btn:hover{ filter:brightness(1.06); }
  #ugt-root .ugt-btn:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  #ugt-root .ugt-btn-ghost{ color:var(--teal-d); background:#fff; border-color:var(--teal); }
  #ugt-root .ugt-btn-ghost:hover{ background:var(--teal-soft); }
  #ugt-root .ugt-btn-danger{ color:#c0392b; border-color:#c0392b; }
  #ugt-root .ugt-btn-danger:hover{ background:#f8dcd6; }
  #ugt-root .ugt-btn[disabled]{ opacity:.45; cursor:not-allowed; }
  #ugt-root .ugt-check{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); cursor:pointer; }

  /* ---- range sliders ---- */
  #ugt-root .ugt-control{ margin:10px 0; }
  #ugt-root .ugt-range{ width:100%; accent-color:var(--teal); }

  /* ---- readout / ± band signature ---- */
  #ugt-root .ugt-readout{ margin-top:12px; font-size:13.5px; }
  #ugt-root .ugt-result{
    display:inline-flex; align-items:stretch; font-family:var(--mono); font-size:15px; font-weight:600;
    border-radius:8px; overflow:hidden; border:1px solid var(--card-edge); margin:4px 0; background:#fff;
  }
  #ugt-root .ugt-result .ugt-rv{ padding:7px 11px; color:var(--ink); }
  #ugt-root .ugt-result .ugt-rpm{
    padding:7px 11px; background:repeating-linear-gradient(135deg,var(--teal-soft),var(--teal-soft) 6px,#e8f4f2 6px,#e8f4f2 12px);
    color:var(--teal-d); border-left:1px dashed var(--teal);
  }
  #ugt-root .ugt-step{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); margin:3px 0; }
  #ugt-root .ugt-step b{ color:var(--ink); }
  #ugt-root .ugt-tag{ display:inline-block; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:6px; }
  #ugt-root .ugt-tag-good{ background:var(--teal-soft); color:var(--teal-d); }
  #ugt-root .ugt-tag-warn{ background:#f8dcd6; color:var(--warn); }

  /* ---- definitions ---- */
  #ugt-root .ugt-defs{ margin:0; }
  #ugt-root .ugt-defs dt{ font-weight:700; font-size:13.5px; margin-top:9px; }
  #ugt-root .ugt-defs dd{ margin:1px 0 0; font-size:13px; color:var(--ink-soft); }

  /* ---- tables ---- */
  #ugt-root .ugt-table-wrap{ overflow-x:auto; margin:6px 0 4px; }
  #ugt-root .ugt-table{ width:100%; border-collapse:collapse; font-size:13px; }
  #ugt-root .ugt-table th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:4px 6px; border-bottom:1px solid var(--line); }
  #ugt-root .ugt-table td{ padding:4px 6px; }
  #ugt-root .ugt-table .ugt-in{ padding:6px 8px; font-size:13px; min-width:62px; }
  #ugt-root .ugt-x{ background:none; border:none; color:var(--rose); font-size:18px; line-height:1; cursor:pointer; padding:2px 6px; }
  #ugt-root .ugt-x:hover{ color:#a51d50; }

  /* ---- target canvas ---- */
  #ugt-root .ugt-target-wrap{ width:100%; max-width:320px; margin:0 auto 6px; }
  #ugt-root .ugt-canvas{ display:block; width:100%; background:#fff; border:1px solid var(--card-edge); border-radius:10px; touch-action:none; }
  #ugt-root .ugt-target-wrap .ugt-canvas{ aspect-ratio:1/1; }
  #ugt-root .ugt-verdict{ font-size:13.5px; font-weight:600; text-align:center; margin-top:8px; color:var(--teal-d); min-height:20px; }

  /* ---- graph layout (large full-width plot) ---- */
  #ugt-root .ugt-graph-layout{ display:block; }
  #ugt-root .ugt-plot-wrap{ width:100%; min-height:430px; }
  #ugt-root .ugt-plot-wrap .ugt-canvas{ aspect-ratio:16/10; min-height:430px; max-height:600px; }
  #ugt-root .ugt-plot-tools{ margin:10px 0 4px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }

      fitBtn.textContent = ds.showFit ? ('· fit shown' + (ds.fitPinned ? ' (selected points only)' : '')) : '· fit hidden';
      fitBtn.title = ds.showFit ? 'Line of best fit is shown for this data set — click to hide it' : 'Click to show this data set\'s own line of best fit';
      fitBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        ds.showFit = !ds.showFit;
        // turning the fit ON also brings the data set onto the graph if it wasn't there — a line of
        // best fit with no visible data set behind it would be confusing, and this is also what
        // makes the "fit hidden" button double as the single switch that reveals a data set that
        // started off entirely (see loadCurve's demo second data set). Turning the fit off again
        // does NOT hide the data set — that stays a separate choice via "Hide data set from graph".
        if(ds.showFit) ds.visible = true;
        renderDatasetChips(); updateDatasetButtons();
        drawCurvePlot(); updateCurveReadout();
      });

      var renameBtn = document.createElement('button');
      renameBtn.type = 'button';
      renameBtn.className = 'ugt-ds-rename';
      renameBtn.textContent = 'Rename';
      renameBtn.title = 'Rename this data set — updates its label on this chip and in the readout below the graph (the movable results box on the graph itself identifies data sets by number, e.g. "Data set (1)", not by name)';
      renameBtn.addEventListener('click', function(ev){ ev.stopPropagation(); startRenameDataset(i, chip); });

      chip.appendChild(swatch); chip.appendChild(nameBtn); chip.appendChild(fitBtn); chip.appendChild(renameBtn);

  // swaps a chip's name button for a text input so the data set's label can be renamed — that label
  // shows on the chip and in the readout below the graph; the movable results box on the canvas
  // itself identifies data sets by number ("Data set (N)") rather than by this editable name
  function startRenameDataset(i, chipEl){
    var ds = datasets[i];
    var input = document.createElement('input');
    input.type = 'text'; input.className = 'ugt-ds-rename-input';
    input.value = ds.label;
    chipEl.innerHTML = '';
    chipEl.appendChild(input);
    input.focus(); input.select();
    var done = false;
    function commit(){
      if(done) return; done = true;
      var v = input.value.trim();
      ds.label = v || ds.label;
      renderDatasetChips(); updateDatasetButtons();
      drawCurvePlot(); updateCurveReadout();
    }
    function cancel(){
      if(done) return; done = true;
      renderDatasetChips();
    }
    input.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){ ev.preventDefault(); commit(); }
      else if(ev.key==='Escape'){ ev.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }
  function updateDatasetButtons(){
    var n = datasets.length;
    var multiple = n >= 2;
    $('ugt-ds-show').disabled = !multiple;
    $('ugt-ds-color').disabled = !multiple;
    $('ugt-ds-add').disabled = n >= MAX_DATASETS;
    $('ugt-ds-show').textContent = (multiple && !datasets[activeDataset].visible) ? 'Show data set on graph' : (multiple ? 'Hide data set from graph' : 'Show data set on graph');
    // the tangent / min-max-gradient tools only make sense while at most one line of best fit is
    // being shown at a time — grey them out (without hiding them) once a second one appears
    var multiFit = multiFitActive();
    $('ugt-cv-snap').disabled = multiFit;
    $('ugt-cv-showtan').disabled = multiFit;
    $('ugt-cv-reveal').disabled = multiFit;
    $('ugt-cv-savemin').disabled = multiFit;
    $('ugt-cv-savemax').disabled = multiFit;
  }
  function switchActiveDataset(i){
    if(i===activeDataset || !datasets[i]) return;

    // set itself, before swapping — mirrors how fitParams survives a switch, so each data set keeps
    // its own saved minimum/maximum lines rather than sharing one global pair
    if(datasets[activeDataset]){ datasets[activeDataset].minLine = minLine; datasets[activeDataset].maxLine = maxLine; }
    activeDataset = i;
    cvData = datasets[i].points;
    minLine = datasets[i].minLine || null;
    maxLine = datasets[i].maxLine || null;
    // selected-row indices are only meaningful against the data set they were selected in
    cvSelected = []; updateSelectUI();
    renderCurveDataTable();
    refitCurve(); resyncPivot();

    drawCurvePlot(); updateCurveReadout();

  function renderPalettePicker(){
    var pal = $('ugt-ds-palette'); pal.innerHTML='';

    var usedByOthers = datasets.filter(function(ds,i){ return i!==activeDataset; }).map(function(ds){ return ds.color; });
    DATASET_PALETTE.forEach(function(color){
      var taken = usedByOthers.indexOf(color) !== -1;
      var btn = document.createElement('button');
      btn.type='button';
      btn.className = 'ugt-swatch-btn' + (taken?' ugt-swatch-taken':'') + (color===current.color?' ugt-swatch-current':'');
      btn.style.background = color;
      btn.disabled = taken;
      btn.title = taken ? 'Already used by another data set' : color;
      btn.addEventListener('click', function(){
        current.color = color;
        renderDatasetChips();
        drawCurvePlot();
        togglePalettePicker(true);

      pal.appendChild(btn);

  function togglePalettePicker(forceHide){
    var pal = $('ugt-ds-palette');

  // short reminder shown above the readout once a second data set exists, so it's clear the
  // fit/tangent/gradient tools below only ever analyse the active data set
  function datasetStatusNote(){

    return '<div class="ugt-step" style="margin-bottom:6px;font-style:italic">'+datasets.length+' data sets exist ('+visibleCount+' shown on the graph). The tools below analyse only the active data set — <b style="color:'+datasets[activeDataset].color+'">'+datasets[activeDataset].label+'</b>. Click a chip above the data table to switch.</div>';
  }

  // swap the visible toolbar buttons, heading and instructions between the "gradient at a point"
  // (curved-shape) tools and the "line of best fit / mean point / min-max gradient" (linear) tools
  function updateModeUI(){
    var lin = !!CURVES[cvType].isLinear;
    $('ugt-cv-snap').hidden = lin;
    $('ugt-cv-reveal').hidden = lin;
    $('ugt-cv-mean').hidden = !lin;
    $('ugt-cv-savemin').hidden = !lin;
    $('ugt-cv-savemax').hidden = !lin;
    $('ugt-cv-h2').textContent = lin ? 'Straight-line graphs & the gradient of the line' : 'Curved graphs & the gradient at a point';
    $('ugt-readout-h3').textContent = lin ? 'Gradient of the line' : 'Gradient at green point';
    $('ugt-cv-method').innerHTML = lin
      ? 'When your data <b>does</b> fall on a straight line, the gradient is a single constant value for the whole graph, not just at one point. Draw the <b>line of best fit</b> — it should pass close to the <b>mean point</b> (x̄, ȳ) of all your data. Then, to put an uncertainty on the gradient, drag the trial line to the steepest line that still passes through every error bar and click <b>“Save as Maximum Gradient”</b>, then do the same for the shallowest such line and <b>“Save as Minimum Gradient”</b>. If you have more than one data set, you must hide the others to be able to add the maximum and minimum lines.'
      : 'Many experiments yield <b>non-linear data</b>, not a straight line — the gradient then only has meaning <b>at a single instantaneous point</b>. Drag the point to choose where on the curve you want the gradient, then drag the tangent’s free end until the line just touches the curve there. A shaded triangle marks the <b>rise</b> and <b>run</b> along your tangent — gradient = rise ÷ run.';
    $('ugt-cv-example').innerHTML = CURVES[cvType].note || '';

  function renderCurveDataTable(){
    var b = $('ugt-cv-d-body'); b.innerHTML='';
    cvData.forEach(function(r,i){
      var tr = document.createElement('tr');
      tr.setAttribute('data-row', i);
      tr.innerHTML =
        '<td><input class="ugt-in" type="number" step="any" value="'+r.x+'" data-k="x"></td>'+
        '<td><input class="ugt-in" type="number" step="any" value="'+r.y+'" data-k="y"></td>'+
        '<td><input class="ugt-in" type="number" step="any" value="'+r.ex+'" data-k="ex"></td>'+
        '<td><input class="ugt-in" type="number" step="any" value="'+r.ey+'" data-k="ey"></td>'+
        '<td><button class="ugt-x" title="Remove">×</button></td>';
      tr.querySelectorAll('input').forEach(function(inp){
        inp.addEventListener('input', function(){ cvDataDirty = true; cvData[i][inp.getAttribute('data-k')] = num(inp.value); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout(); });
      });
      tr.querySelector('.ugt-x').addEventListener('click', function(){ if(cvData.length>2){ cvDataDirty = true; cvData.splice(i,1); renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout(); } });

  // the ↑/↓ arrow keys nudge a number input's value by default — in a table of readings that's a
  // trap (a stray press quietly changes a result), so it's disabled in favour of the arrow moving
  // between cells instead, the way a spreadsheet works: ↓ to the same column in the next row, ↑ to
  // the row above. Typing and pasting values is unaffected.
  $('ugt-cv-d-body').addEventListener('keydown', function(ev){
    if(ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    var input = ev.target.closest ? ev.target.closest('input[data-k]') : null;
    if(!input) return;
    ev.preventDefault();
    var tr = input.closest('tr');
    var targetTr = ev.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling;
    if(!targetTr) return;
    var col = input.getAttribute('data-k');
    var targetInput = targetTr.querySelector('input[data-k="'+col+'"]');
    if(targetInput){ targetInput.focus(); targetInput.select(); }
  });
  $('ugt-cv-d-add').addEventListener('click', function(){
    cvDataDirty = true;
    if(!cvData.length){
      var e0 = cvXExtent();
      var nx0 = e0.min + (e0.max-e0.min)/2;
      var ny0 = curveY(nx0); if(!isFinite(ny0)) ny0 = 0;
      cvData.push({x:roundSig(nx0,3), y:roundSig(ny0,3), ex:0, ey:0});
    } else {
      var last = cvData[cvData.length-1];
      var nx = num(last.x) + ((cvXExtent().max-cvXExtent().min)/cvData.length || 1);
      var ny = curveY(nx); if(!isFinite(ny)) ny = 0;
      cvData.push({x:nx, y:ny, ex:last.ex, ey:last.ey});
    }
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
  });

  // shortcut for a fixed (e.g. instrumental) uncertainty shared by every point,
  // instead of typing or pasting the same ± value into each row by hand
  $('ugt-cv-unc-apply').addEventListener('click', function(){
    var exRaw = $('ugt-cv-ex-all').value, eyRaw = $('ugt-cv-ey-all').value;
    var hasEx = exRaw !== '', hasEy = eyRaw !== '';
    if(!hasEx && !hasEy) return;
    cvDataDirty = true;
    cvData.forEach(function(d){
      if(hasEx) d.ex = Math.abs(num(exRaw));
      if(hasEy) d.ey = Math.abs(num(eyRaw));
    });
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
  });

  // spreadsheet-style paste: copy a column (or block) of numbers from Excel/Sheets, click the
  // first cell you want it to land in, and paste — it fills down (and across, if you copied
  // more than one column) instead of having to paste one value at a time
  $('ugt-cv-d-body').addEventListener('paste', function(ev){
    var input = ev.target.closest ? ev.target.closest('input[data-k]') : null;
    if(!input) return;
    var text = (ev.clipboardData || window.clipboardData).getData('text');
    if(!text || !/[\t\n\r]/.test(text)) return; // single value — let the normal paste happen
    ev.preventDefault();
    cvDataDirty = true;
    var keys = ['x','y','ex','ey'];
    var tr = input.closest('tr');
    var startRow = parseInt(tr.getAttribute('data-row'), 10) || 0;
    var startCol = keys.indexOf(input.getAttribute('data-k'));
    var rows = text.replace(/\r/g,'').split('\n').filter(function(r){ return r.length; });
    rows.forEach(function(rowText, ri){
      var cells = rowText.split('\t');
      cells.forEach(function(cellText, ci){
        var col = startCol + ci;
        if(col >= keys.length) return;
        var rowIdx = startRow + ri;
        while(rowIdx >= cvData.length){ cvData.push({x:0,y:0,ex:0,ey:0}); }
        var v = parseFloat(cellText);
        if(isFinite(v)) cvData[rowIdx][keys[col]] = v;
      });
    });
    renderCurveDataTable(); refitCurve(); resyncPivot(); drawCurvePlot(); updateCurveReadout();
  });

  var CURVE_SAVE_KEY = 'ugt_curve_save_v1';
  $('ugt-cv-d-save').addEventListener('click', function(){

    var ok = lsSet(CURVE_SAVE_KEY, JSON.stringify(payload));

  $('ugt-cv-d-load').addEventListener('click', function(){

    try{
      var p = JSON.parse(raw);
      if(!p.data || !p.data.length) throw new Error('empty');
      if(p.cvType && CURVES[p.cvType]){ cvType = p.cvType; $('ugt-cv-type').value = cvType; }
      cvDataDirty = true;
      minLine = null; maxLine = null; meanPointShown = false;
      manualRange = null; $('ugt-cv-xmax').value=''; $('ugt-cv-ymax').value='';
      cvSelected = []; updateSelectUI();

      datasets[activeDataset].points = cvData;
      datasets[activeDataset].fitPinned = false;
      datasets[activeDataset].minLine = null; datasets[activeDataset].maxLine = null;
      if(p.xlab!=null) $('ugt-cv-xlab').value=p.xlab; if(p.xunit!=null) $('ugt-cv-xunit').value=p.xunit;
      if(p.ylab!=null) $('ugt-cv-ylab').value=p.ylab; if(p.yunit!=null) $('ugt-cv-yunit').value=p.yunit;

      flashStatus($('ugt-cv-d-status'), 'Loaded '+cvData.length+' point(s), saved '+(p.savedAt? new Date(p.savedAt).toLocaleString() : 'earlier')+'.');

  $('ugt-cv-d-csv').addEventListener('click', function(){

  function loadCurve(type){

      // tools only make sense with one line of best fit on screen, and a teacher opening a fresh
